<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart-Coder Gemini</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <img src="icons/icon48.png" alt="Smart-Coder Gemini Logo" class="app-icon">
        <div class="title-group">
          <h1 class="app-title">Smart-Coder</h1>
          <span class="app-subtitle">Gemini C++17</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="open-settings-btn" class="icon-btn" title="Open Settings" aria-label="Open Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
      <div id="key-status-pill" class="pill pill-unknown">
        <span class="status-dot"></span>
        <span id="key-status-text">Checking API Key…</span>
      </div>
      <div class="shortcut-badge" title="Registered generation shortcut">
        <code>Alt+Shift+G</code>
      </div>
    </div>

    <!-- Missing Key Alert -->
    <div id="missing-key-banner" class="alert-banner hidden">
      <div class="alert-content">
        <strong>API Key Missing:</strong> Configure your Google Gemini API key in Settings before generating solutions.
      </div>
      <button id="alert-settings-btn" class="btn-sm btn-accent">Open Settings</button>
    </div>

    <!-- Side Panel Quick Toggle Card -->
    <div class="side-panel-toggle-card">
      <button id="toggle-sidepanel-btn" class="btn btn-secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        Toggle On-Screen Side Panel
      </button>
    </div>

    <!-- Extraction / Input Controls -->
    <section class="section-card">
      <div class="card-header">
        <label for="problem-input" class="card-title">Problem Statement</label>
        <button id="extract-page-btn" class="btn-sm btn-secondary" title="Extract problem from active browser tab">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Extract from Page
        </button>
      </div>
      <textarea id="problem-input" rows="4" placeholder="Paste problem statement or use 'Extract from Page'…"></textarea>

      <div class="action-row">
        <button id="generate-btn" class="btn btn-primary">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span id="generate-btn-text">Generate C++17 Solution</span>
        </button>
      </div>
    </section>

    <!-- Progress / Alert Notice -->
    <div id="progress-indicator" class="progress-indicator hidden" role="status">
      <div class="spinner"></div>
      <span id="progress-text">Thinking…</span>
    </div>

    <!-- Error Notice -->
    <div id="error-box" class="error-box hidden" role="alert">
      <div class="error-icon">⚠️</div>
      <div id="error-message" class="error-message"></div>
    </div>

    <!-- Solution Output Card -->
    <section id="solution-section" class="section-card solution-card hidden">
      <div class="card-header">
        <span class="card-title">C++17 Solution</span>
        <div class="card-actions">
          <button id="copy-solution-btn" class="btn-sm btn-secondary" title="Copy code to clipboard">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-btn-text">Copy Code</span>
          </button>
        </div>
      </div>
      <pre class="code-view"><code id="solution-code" class="language-cpp"></code></pre>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Permitted coding practice assistant &bull; C++17</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
